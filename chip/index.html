<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мам, купи чипсы</title>
<style>
:root{--bg:#120607;--red:#e3262b;--yel:#ffc21a;--txt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Arial Black",Impact,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 16px 22px;position:relative;
background:radial-gradient(circle at 50% 38%,#5a0f12 0%,var(--bg) 62%)}
.bolt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bolt i{position:absolute;top:-20%;width:6px;height:140%;background:linear-gradient(#2aa8ff,transparent);transform:rotate(18deg);opacity:.35;animation:slide 3s linear infinite}
@keyframes slide{from{transform:translateY(-30%) rotate(18deg)}to{transform:translateY(30%) rotate(18deg)}}
h1{margin:0;text-align:center;font-size:clamp(26px,8vw,44px);line-height:1.05;text-transform:none;min-height:2.2em;z-index:2;text-shadow:0 3px 0 #000}
h1 b{color:var(--yel)}
.stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:2}
#bag{height:min(46vh,420px);max-width:80%;object-fit:contain;filter:drop-shadow(0 18px 30px #000);
transform:translateY(-120vh) rotate(-20deg);animation:drop 1s cubic-bezier(.3,1.5,.5,1) .2s forwards, wob 2.2s ease-in-out 1.3s infinite;transition:height .3s}
@keyframes drop{to{transform:translateY(0) rotate(0)}}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.05)}}
.wing{position:absolute;font-size:34px;opacity:0;animation:fly 2.6s ease-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,40px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-190px) rotate(var(--r)) scale(1.1)}}
.say{z-index:2;text-align:center;font-size:18px;min-height:1.5em;color:var(--yel)}
button{z-index:2;border:0;border-radius:999px;padding:16px 34px;font:inherit;font-size:20px;color:#fff;background:var(--red);
box-shadow:0 6px 0 #7d0f13;cursor:pointer;animation:pulse 1.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #7d0f13}
@keyframes pulse{50%{transform:scale(1.07)}}
.heart{position:absolute;bottom:20%;font-size:28px;pointer-events:none;animation:up 1.6s ease-out forwards;z-index:3}
@keyframes up{to{transform:translateY(-55vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#bag,.wing,button,.bolt i{animation:none;transform:none;opacity:1}.wing{display:none}}
</style></head><body>

<button id="b">Ну мам, купи 🙏</button>
<script>
var lines=["Мам, привет! 👋","Ты же уже в магазине?","Купи, пожалуйста, <b>вот эти</b> чипсы 🍗"];
var h=document.getElementById("h"),i=0;
function next(){if(i<lines.length){h.innerHTML=lines[i++];setTimeout(next,1700)}}
setTimeout(next,900);
var msgs=["Ну пожалуйста 🥺","Я потом сам за хлебом схожу!","Обещаю, только одну пачку","Ты самая лучшая мама на свете ❤️","Это последний раз (нет) 😅","Спасибо, мам! Люблю! 🥰"];
var n=0,s=document.getElementById("s"),bag=document.getElementById("bag");
document.getElementById("b").onclick=function(){
 s.textContent=msgs[Math.min(n,msgs.length-1)];
 bag.style.height="min("+(46+Math.min(n,5)*3)+"vh,"+(420+n*20)+"px)";
 for(var k=0;k<6;k++){var e=document.createElement("div");e.className="heart";e.textContent=["❤️","🍗","🔥","🥰"][k%4];
  e.style.left=(10+Math.random()*80)+"%";e.style.animationDelay=(k*0.08)+"s";document.body.appendChild(e);setTimeout(function(x){x.remove()},2000,e)}
 n++;
};
</script></body></html>
